<svg xmlns="http://www.w3.org/2000/svg" width="854" height="658" viewBox="0 0 854 658">
  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  <defs>
    <marker id="start-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" fill="#1f2328">
    <text x="36" y="42" font-size="15" font-weight="600">서버 실행 흐름</text>

    <rect x="110" y="78" width="360" height="84" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="290" y="108" font-size="14" text-anchor="middle">
      <tspan x="290">start-windows.cmd 더블클릭</tspan>
      <tspan x="290" dy="1.3em">또는 npm start</tspan>
    </text>

    <path d="M 290 162 V 205" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#start-flow-arrow)"/>

    <rect x="110" y="205" width="360" height="64" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="290" y="244" font-size="14" text-anchor="middle">g++ 를 실행할 수 있나?</text>

    <path d="M 470 237 H 560" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#start-flow-arrow)"/>
    <text x="511" y="224" font-size="13" text-anchor="middle">없음</text>
    <rect x="560" y="194" width="270" height="86" rx="8" fill="#fff8f8" stroke="#cf222e"/>
    <text x="695" y="225" font-size="14" text-anchor="middle">
      <tspan x="695">중단</tspan>
      <tspan x="695" dy="1.3em">MSYS2 설치 명령 안내</tspan>
    </text>

    <path d="M 290 269 V 320" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#start-flow-arrow)"/>
    <text x="309" y="298" font-size="13">있음</text>

    <rect x="110" y="320" width="360" height="64" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="290" y="359" font-size="14" text-anchor="middle">포트 12014 가 비어 있나?</text>

    <path d="M 470 352 H 560" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#start-flow-arrow)"/>
    <text x="511" y="339" font-size="13" text-anchor="middle">사용 중</text>
    <rect x="560" y="309" width="270" height="86" rx="8" fill="#fff8f8" stroke="#cf222e"/>
    <text x="695" y="340" font-size="14" text-anchor="middle">
      <tspan x="695">중단</tspan>
      <tspan x="695" dy="1.3em">기존 서버 종료 방법 안내</tspan>
    </text>

    <path d="M 290 384 V 435" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#start-flow-arrow)"/>
    <text x="309" y="413" font-size="13">비어 있음</text>

    <rect x="110" y="435" width="360" height="84" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="290" y="465" font-size="14" text-anchor="middle">
      <tspan x="290">접속 주소 출력</tspan>
      <tspan x="290" dy="1.3em">127.0.0.1 · LAN IP</tspan>
    </text>

    <path d="M 290 519 V 570" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#start-flow-arrow)"/>

    <rect x="110" y="570" width="360" height="64" rx="8" fill="#f6fff8" stroke="#1a7f37"/>
    <text x="290" y="609" font-size="14" font-weight="600" text-anchor="middle">채점 서버 기동</text>
  </g>
</svg>
